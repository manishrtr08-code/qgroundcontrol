name: Android 32/64-bit Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'Stable*'
      - 'custom-v4.4.4'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - 'docs/**'

defaults:
  run:
    shell: bash

env:
  SOURCE_DIR:   ${{ github.workspace }}
  QT_VERSION:   5.15.2
  BUILD_TYPE:   ${{ fromJSON('["DailyBuild", "StableBuild"]')[ github.ref_type == 'tag' || contains(github.ref, 'Stable_' ) ] }}

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: 64bits
            eabi: arm64-v8a
            ARTIFACT: QGroundControl64.apk
          - architecture: 32bits
            eabi: armeabi-v7a
            ARTIFACT: QGroundControl32.apk

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Get all tags for correct version determination
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --all --tags -f --depth 1

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version:      ${{ env.QT_VERSION }}
          host:         linux
          target:       android
          dir:          ${{ runner.temp }}
          modules:      qtcharts
          setup-python: true

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: false

      - name: Clean Android SDK and force android-33 only
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-33" "build-tools;33.0.2" || true
          for dir in "${ANDROID_SDK_ROOT}/platforms/"*; do
            if [ "$(basename "$dir")" != "android-33" ]; then
              sudo rm -rf "$dir"
            fi
          done
          for dir in "${ANDROID_SDK_ROOT}/build-tools/"*; do
            if [ "$(basename "$dir")" != "33.0.2" ]; then
              sudo rm -rf "$dir"
            fi
          done
          # Lock compileSdkVersion to 33 inside Qt's gradle template so "ext19" can never break it
          find ${{ runner.temp }} -name "build.gradle" -exec sed -i 's/androidCompileSdkVersion.toInteger()/33/g' {} + || true
          find ${SOURCE_DIR} -name "build.gradle" -exec sed -i 's/androidCompileSdkVersion.toInteger()/33/g' {} + || true
          ls -la "${ANDROID_SDK_ROOT}/platforms"
          ls -la "${ANDROID_SDK_ROOT}/build-tools"

      - name: Install ccache and aria2
        run: sudo apt-get update && sudo apt-get install -y ccache aria2

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: echo "timestamp=$(date --utc +'%Y-%m-%d-%H;%M;%S')" >> $GITHUB_OUTPUT

      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path:         ~/.ccache
          key:          ${{ runner.os }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Setup ccache
        run: |
            mkdir -p ~/.ccache
            echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
            echo "compression = true" >> ~/.ccache/ccache.conf
            echo "compression_level = 5" >> ~/.ccache/ccache.conf
            ccache -s
            ccache -z

      - name: Create build directory
        run: mkdir ${{ runner.temp }}/shadow_build_dir

      - name: Install gstreamer
        working-directory: ${{ github.workspace }}
        run: |
            aria2c -x 16 -s 16 -k 1M --max-tries=10 --retry-wait=5 --user-agent="Mozilla/5.0" \
              -o gstreamer-1.0-android-universal-1.18.6.tar.xz \
              https://gstreamer.freedesktop.org/data/pkg/android/1.18.6/gstreamer-1.0-android-universal-1.18.6.tar.xz
            mkdir -p gstreamer-1.0-android-universal-1.18.6
            tar xf gstreamer-1.0-android-universal-1.18.6.tar.xz -C gstreamer-1.0-android-universal-1.18.6

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
            qmake -r ${SOURCE_DIR}/qgroundcontrol.pro -spec android-clang CONFIG+=${BUILD_TYPE} CONFIG+=installer ANDROID_ABIS="${{ matrix.eabi }}"
            make -j2

      - name: ccache post-run
        run: ccache -s

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: ${{ runner.temp }}/shadow_build_dir/package/${{ matrix.ARTIFACT }}
